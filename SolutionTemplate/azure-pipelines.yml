# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core
name: '$(Build.SourceBranchName)$(rev:.r)'

trigger:
- main
- release/*

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/**.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  CRM_SDK_PATH: 'C:/hostedtoolcache/windows\CdsDevTools\Tools'
  Version.Revision: '$(Build.SourceBranchName)'
  Version.Formatted: '$(Build.BuildNumber)'
  utcdate: ''
  solutionversion: ''
  # Set this to the {org-guid}/{feed-guid} of this project's own ADO Artifacts feed
  # (where the CDS dependency artifact package will be published on main builds)
  ProjectFeedId: 'replace-with-your-org-guid/replace-with-your-feed-guid'
  # Tool versions are pinned deliberately so a Microsoft.PowerApps.CLI.Tool, Node.js, or PowerShell
  # Gallery release can't silently break CI. Bump these on purpose, not by accident -
  # check https://www.nuget.org/packages/Microsoft.PowerApps.CLI.Tool for newer PAC CLI releases.
  PacCliVersion: '2.9.3'
  NodeVersion: '22.x'

steps:
- task: NuGetToolInstaller@1
  inputs:
    versionSpec: '6.x'

- task: PowerShell@2
  displayName: 'Enforce branch merge rules'
  inputs:
    targetType: 'inline'
    script: |
      if ($env:BUILD_SOURCEBRANCHNAME -ne 'merge') {
          Write-Host "Not a PR merge build — skipping branch merge enforcement."
          exit 0
      }

      $target = $env:SYSTEM_PULLREQUEST_TARGETBRANCH -replace '^refs/heads/', ''
      $source = $env:SYSTEM_PULLREQUEST_SOURCEBRANCH -replace '^refs/heads/', ''
      Write-Host "PR: '$source' -> '$target'"

      if ($target -eq 'main') {
          if ($source -notlike 'feature/*' -and $source -notlike 'bugfix/*' -and $source -notlike 'issue/*' -and $source -notlike 'hotfix/*') {
              Write-Host "##vso[task.logissue type=error]Only 'feature/*', 'bugfix/*', 'issue/*', or 'hotfix/*' branches may merge into 'main'. Attempted: '$source' -> '$target'."
              exit 1
          }
      } elseif ($target -like 'release/*') {
          if ($source -ne 'main' -and $source -notlike 'hotfix/*') {
              Write-Host "##vso[task.logissue type=error]Only 'main' or 'hotfix/*' branches may merge into 'release/*'. Attempted: '$source' -> '$target'."
              exit 1
          }
      }

      Write-Host "Branch merge check passed."

- task: PowerShell@2
  displayName: 'Install Supporting PowerShell Modules'
  inputs:
    targetType: 'inline'
    # Versions are pinned so a new Gallery release can't break CI unannounced.
    # Bump deliberately after testing against a real import/export run.
    script: |
      # Import supporting PowerShell modules
      Install-PackageProvider -Name NuGet -Force -Scope CurrentUser
      Install-Module -Name Microsoft.Xrm.Data.Powershell -RequiredVersion 2.8.21 -Force -Verbose -Scope CurrentUser
      Install-Module -Name Microsoft.Xrm.Tooling.ConfigurationMigration -RequiredVersion 1.0.0.88 -Force -Verbose -Scope CurrentUser
      Install-Module -Name Microsoft.Xrm.DevOps.Data.PowerShell -RequiredVersion 1.4.2 -Force -Verbose -Scope CurrentUser

- task: PowerShell@2
  displayName: 'Get solution version number'
  condition: succeeded()
  inputs:
    targetType: 'inline'
    script: |
      $fileName = $Env:BUILD_SOURCESDIRECTORY + '\DeploymentPackage\CdsSolution\Other\Solution.xml'
      [xml] $xdoc = get-content $fileName
      $date = $(Get-Date([datetime]::UtcNow) -UFormat "0.%Y.%m%d.%H%M")
      $version = $xdoc.ImportExportXml.SolutionManifest.Version
      $(Build.BuildId) | Out-File $(Build.ArtifactStagingDirectory)\buildId.txt
      Write-Host "##vso[task.setvariable variable=solutionversion]$version"
      Write-Host "##vso[task.setvariable variable=utcdate]$date"

- task: PowerShell@2
  displayName: 'Validate Solution Version Number'
  condition: and(succeeded(), ge(variables['solutionversion'], variables['utcdate']))
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "##vso[task.logissue type=error;]Solution Version Number is Higher than UTC Time version"
      exit 1

- task: PowerShell@2
  displayName: 'Set Cds Solution Number to Build Version Number'
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
  inputs:
    targetType: 'inline'
    script: |
      # Update the version number in the solution file before packing
      $fileName = $Env:BUILD_SOURCESDIRECTORY + '\DeploymentPackage\CdsSolution\Other\solution.xml'
      Write-Host Solution file location is $fileName
      Write-Host Setting version number to $Env:Version_Formatted
      [xml] $xdoc = get-content $fileName
      $version = $xdoc.SelectSingleNode('//Version')
      $version.InnerText = $Env:Version_Formatted
      $xdoc.Save($fileName)

- task: NuGetCommand@2
  displayName: 'NuGet Solution Restore'
  inputs:
    command: 'restore'
    restoreSolution: '$(solution)'
    feedsToUse: 'select'
    vstsFeed: '$(ProjectFeedId)'

- task: PowerShell@2
  displayName: 'Install PAC CLI'
  inputs:
    targetType: 'inline'
    # Pinned to $(PacCliVersion) above so `pac solution pack` behavior can't change mid-project.
    script: |
      dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $(PacCliVersion)
      Write-Host "##vso[task.prependpath]$env:USERPROFILE\.dotnet\tools"

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: VSTest@2
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: UseNode@1
  displayName: 'Install Node.js'
  inputs:
    version: '$(NodeVersion)'

- task: PowerShell@2
  displayName: 'Build Code Apps'
  inputs:
    targetType: 'inline'
    # Builds each CodeApps/<AppName> to catch breakage. Publishing (pa app push) is manual - see CodeApps/README.md.
    script: |
      $ErrorActionPreference = 'Stop'
      $codeAppsRoot = Join-Path $env:BUILD_SOURCESDIRECTORY 'CodeApps'
      $apps = @(Get-ChildItem $codeAppsRoot -Directory -ErrorAction SilentlyContinue |
          Where-Object { Test-Path (Join-Path $_.FullName 'package.json') })

      if ($apps.Count -eq 0) {
          Write-Host "No code apps found — skipping."
          exit 0
      }

      foreach ($app in $apps) {
          Write-Host "Building code app '$($app.Name)'"
          Push-Location $app.FullName
          try {
              npm ci
              if ($LASTEXITCODE -ne 0) { throw "npm ci failed for '$($app.Name)'" }
              npm run build
              if ($LASTEXITCODE -ne 0) { throw "npm run build failed for '$($app.Name)'" }
          } finally {
              Pop-Location
          }
      }

- task: NuGetCommand@2
  displayName: 'NuGet Pack Cds Dependency Artifact Package'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    command: 'pack'
    packagesToPack: 'DeploymentPackage/CdsArtifacts.nuspec'
    versioningScheme: 'byEnvVar'
    versionEnvVar: 'solutionversion'

- task: NuGetAuthenticate@1
  displayName: 'NuGet Authenticate'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

- task: NuGetCommand@2
  displayName: 'NuGet Push Cds Dependency Artifact Package'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'internal'
    publishVstsFeed: '$(ProjectFeedId)'
    allowPackageConflicts: true

- task: CopyFiles@2
  displayName: 'Copy DevOps Artifacts to Artifact Staging'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)'
    contents: 'DeploymentPackage/temp/packed/?(*.zip)'
    targetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true

- task: CopyFiles@2
  displayName: 'Copy Deployment Artifacts to Artifact Staging'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)/DeploymentPackage/temp/'
    contents: 'deployment/**'
    targetFolder: '$(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifacts to Pipeline'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
